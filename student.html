<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой органайзер — ученик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 Мой органайзер</div>
    <div class="user-badge" id="userBadge"></div>
    <button class="btn-exit" onclick="logout()">Выход</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="diary">Дневник</button>
    <button class="tab" data-tab="progress">Успеваемость</button>
    <button class="tab" data-tab="courses">Курсы</button>
  </nav>

  <main>
    <section id="diary" class="panel">
      <h2>Мой дневник</h2>
      <table>
        <thead><tr><th>Предмет</th><th>Домашнее задание</th><th>Оценка</th></tr></thead>
        <tbody id="diaryBody"></tbody>
      </table>
    </section>

    <section id="progress" class="panel hidden">
      <h2>Успеваемость</h2>
      <div class="stat-cards">
        <div class="stat-card"><span id="avgGrade">—</span><small>Средний балл</small></div>
        <div class="stat-card"><span id="gradesCount">0</span><small>Всего оценок</small></div>
      </div>
      <h3>Итоговые оценки</h3>
      <table>
        <thead><tr><th>Предмет</th><th>Итог</th></tr></thead>
        <tbody id="finalBody"></tbody>
      </table>
    </section>

    <section id="courses" class="panel hidden">
      <h2>Курсы</h2>
      <div class="course-grid">
        <button class="course-card" onclick="openCourse('math')">➕ Математика — решение задач</button>
        <button class="course-card" onclick="openCourse('essay')">✍️ Русский — написать сочинение</button>
        <button class="course-card" onclick="openCourse('eng')">🇬🇧 Английский — грамматика</button>
      </div>
      <div id="courseWork" class="hidden">
        <h3 id="courseTitle"></h3>
        <p id="courseTask" class="task-text"></p>
        <textarea id="courseAnswer" placeholder="Впишите ваш ответ здесь..."></textarea>
        <button class="btn-main" onclick="submitCourse()">Отправить работу</button>
        <div id="courseResult"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
