<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой органайзер — учитель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 Мой органайзер</div>
    <div class="user-badge" id="userBadge"></div>
    <button class="btn-exit" onclick="logout()">Выход</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="journal">Журнал</button>
    <button class="tab" data-tab="reports">Отчёты</button>
  </nav>

  <main>
    <section id="journal" class="panel">
      <h2>Журнал</h2>
      <div class="form-row">
        <select id="studentSelect"></select>
        <select id="subjectSelect">
          <option>Математика</option><option>Русский язык</option>
          <option>Литература</option><option>Английский язык</option>
        </select>
        <input type="number" id="gradeValue" min="2" max="5" placeholder="Оценка">
        <button class="btn-main" onclick="addGrade()">Выставить</button>
      </div>
      <table>
        <thead><tr><th>Ученик</th><th>Предмет</th><th>Оценка</th><th>Дата</th></tr></thead>
        <tbody id="journalBody"></tbody>
      </table>
    </section>

    <section id="reports" class="panel hidden">
      <h2>Отчёт по успеваемости</h2>
      <table>
        <thead><tr><th>Ученик</th><th>Средний балл</th><th>Оценок</th><th>Статус</th></tr></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
