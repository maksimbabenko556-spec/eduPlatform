<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой органайзер — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-area">
        <div class="logo-icon">📚</div>
        <h1>Мой органайзер</h1>
        <p class="subtitle">Рады видеть вас снова</p>
      </div>

      <h2>Вход</h2>
      <form id="loginForm">
        <input type="email" id="logEmail" placeholder="Электронная почта" required>
        <input type="password" id="logPass" placeholder="Пароль" required>
        <input type="password" id="logCode" class="hidden" placeholder="Код доступа">
        <button type="submit" class="btn-main">Войти</button>
      </form>

      <p class="switch">Нет аккаунта? <a href="index.html">Зарегистрироваться</a></p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
