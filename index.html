<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Музыка.ру — музыкальный портал</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Регистрация ===== -->
  <div id="authWrap" class="auth-wrap">
    <div class="auth-card">
      <div class="logo-icon">🎵</div>
      <h1>Музыка<span class="dot-ru">.ру</span></h1>
      <p class="subtitle">Музыкальный портал для авторов</p>

      <form id="regForm">
        <input type="text" id="regFio" placeholder="Полное ФИО *" required>
        <input type="tel" id="regPhone" placeholder="Телефон *" required>
        <input type="email" id="regEmail" placeholder="Электронная почта *" required>
        <input type="password" id="regPass" placeholder="Пароль *" required minlength="4">
        <div class="role-row">
          <label class="role-chip"><input type="radio" name="role" value="author" checked> Автор</label>
          <label class="role-chip"><input type="radio" name="role" value="moderator"> Модератор</label>
        </div>
        <input type="password" id="regCode" class="hidden" placeholder="Код доступа">
        <button type="submit" class="btn">Зарегистрироваться</button>
      </form>
      <p class="switch">Уже есть аккаунт? <a href="#" id="toLogin">Войти</a></p>

      <div id="loginBlock" class="hidden">
        <h2>Вход</h2>
        <form id="loginForm">
          <input type="email" id="logEmail" placeholder="Почта" required>
          <input type="password" id="logPass" placeholder="Пароль" required>
          <button type="submit" class="btn">Войти</button>
        </form>
        <p class="switch"><a href="#" id="toReg">Назад к регистрации</a></p>
      </div>
    </div>
  </div>

  <!-- ===== Приложение ===== -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🎵 Музыка<span class="dot-ru">.ру</span></div>
      <div class="user-info" id="userBadge"></div>

      <div id="authorMenu">
        <button class="nav-btn nav-plus" data-view="upload">⬆ Загрузка треков</button>
        <button class="nav-btn" data-view="history">📋 История заявок</button>
        <button class="nav-btn" data-view="mine">💿 Мои треки</button>
      </div>

      <div id="modMenu" class="hidden">
        <button class="nav-btn active" data-view="all">📥 Общие заявки</button>
        <button class="nav-btn" data-view="verified">✅ Верифицированные заявки</button>
      </div>

      <button class="nav-btn exit" id="exitBtn">↩ Выйти</button>
    </aside>

    <main class="content">
      <!-- Загрузка треков -->
      <section id="view-upload" class="view hidden">
        <h1>Загрузка трека</h1>
        <form id="trackForm" class="panel-form">
          <div class="form-row">
            <span class="form-label">Название трека</span>
            <input type="text" id="trackTitle" placeholder="Например: Ночная дорога" required>
          </div>
          <div class="form-row">
            <span class="form-label">О треке</span>
            <textarea id="trackDesc" placeholder="О чём песня, настроение, авторы..." required></textarea>
          </div>
          <div class="form-row">
            <span class="form-label">Файл трека</span>
            <input type="file" id="trackFile" accept="audio/*" required>
          </div>
          <button type="submit" class="btn">Отправить на модерацию</button>
        </form>
        <p id="uploadMsg" class="ok-msg hidden"></p>
      </section>

      <!-- История заявок -->
      <section id="view-history" class="view hidden">
        <h1>История заявок</h1>
        <div id="historyList"></div>
      </section>

      <!-- Мои треки (одобренные с комментариями) -->
      <section id="view-mine" class="view hidden">
        <h1>Мои треки</h1>
        <div id="myList"></div>
      </section>

      <!-- Общие заявки (модератор) -->
      <section id="view-all" class="view hidden">
        <h1>Общие заявки</h1>
        <div id="allList"></div>
      </section>

      <!-- Верифицированные заявки (модератор) -->
      <section id="view-verified" class="view hidden">
        <h1>Верифицированные заявки</h1>
        <div id="verList"></div>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
