<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Образовательная платформа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЭКРАН АВТОРИЗАЦИИ И РЕГИСТРАЦИИ -->
  <div id="auth-screen" class="auth-wrapper">
    <div class="auth-card">
      <h1 id="auth-title">Регистрация</h1>

      <form id="auth-form">
        <div id="register-fields">
          <div class="form-group">
            <label>Имя</label>
            <input type="text" id="first-name" placeholder="Введите имя">
          </div>
          <div class="form-group">
            <label>Фамилия</label>
            <input type="text" id="last-name" placeholder="Введите фамилию">
          </div>
          <div class="form-group">
            <label>Ваша роль</label>
            <select id="user-role">
              <option value="student">Ученик</option>
              <option value="teacher">Учитель</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="login-input" placeholder="Придумайте или введите логин" required>
        </div>

        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password-input" placeholder="Введите пароль" required>
        </div>

        <p id="auth-error" class="error-msg"></p>

        <button type="submit" id="auth-submit-btn" class="btn-primary">Зарегистрироваться</button>
      </form>

      <div class="auth-switch">
        <span id="switch-text">Есть аккаунт?</span>
        <button type="button" id="switch-mode-btn" class="btn-link">Войти</button>
      </div>
    </div>
  </div>

  <!-- ОСНОВНАЯ ПЛАТФОРМА (ОТКРЫВАЕТСЯ ПОСЛЕ ВХОДА) -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <div class="brand">Школьный Портал</div>
      <div class="user-panel">
        <span id="user-badge" class="badge"></span>
        <span id="user-fullname" class="user-name"></span>
        <button id="logout-btn" class="btn-outline">Выйти</button>
      </div>
    </header>

    <!-- ИНТЕРФЕЙС УЧЕНИКА -->
    <main id="student-view" class="container hidden">
      <nav class="tabs">
        <button class="tab-btn active" data-target="student-subjects">Предметы и решения</button>
        <button class="tab-btn" data-target="student-diary">Мой дневник</button>
      </nav>

      <!-- Вкладка 1: Предметы и базовые решения -->
      <section id="student-subjects" class="tab-content">
        <h2>Школьные предметы и базовые решения</h2>
        <div id="subjects-grid" class="grid"></div>
      </section>

      <!-- Вкладка 2: Дневник ученика -->
      <section id="student-diary" class="tab-content hidden">
        <div class="section-header">
          <h2>Дневник оценок</h2>
          <button id="request-grade-btn" class="btn-primary">Отправить работу на оценку учителю</button>
        </div>
        <p id="request-status" class="success-msg"></p>
        <table class="data-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Предмет</th>
              <th>Тема / Задание</th>
              <th>Оценка</th>
            </tr>
          </thead>
          <tbody id="student-grades-body"></tbody>
        </table>
      </section>
    </main>

    <!-- ИНТЕРФЕЙС УЧИТЕЛЯ -->
    <main id="teacher-view" class="container hidden">
      <nav class="tabs">
        <button class="tab-btn active" data-target="teacher-journal">Журнал оценок</button>
        <button class="tab-btn" data-target="teacher-templates">Шаблоны и отчёты</button>
      </nav>

      <!-- Вкладка 1: Журнал учителя -->
      <section id="teacher-journal" class="tab-content">
        <h2>Журнал оценок учеников</h2>
        <div class="card form-inline">
          <input type="text" id="grade-student-name" placeholder="Имя и фамилия ученика" required>
          <select id="grade-subject">
            <option value="Алгебра">Алгебра</option>
            <option value="Русский язык">Русский язык</option>
            <option value="Физика">Физика</option>
            <option value="История">История</option>
            <option value="Информатика">Информатика</option>
          </select>
          <input type="text" id="grade-topic" placeholder="Работа (например, Контрольная)">
          <select id="grade-value">
            <option value="5">5 (Отлично)</option>
            <option value="4">4 (Хорошо)</option>
            <option value="3">3 (Удовл.)</option>
            <option value="2">2 (Неуд.)</option>
          </select>
          <button id="add-grade-btn" class="btn-primary">Поставить оценку</button>
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Ученик</th>
              <th>Предмет</th>
              <th>Работа</th>
              <th>Оценка</th>
            </tr>
          </thead>
          <tbody id="teacher-grades-body"></tbody>
        </table>
      </section>

      <!-- Вкладка 2: Шаблоны и отчёты -->
      <section id="teacher-templates" class="tab-content hidden">
        <h2>Создание шаблонов и отчётов</h2>
        <div class="card">
          <div class="form-group">
            <label>Тип документа</label>
            <select id="doc-type">
              <option value="Шаблон урока">Шаблон урока / задания</option>
              <option value="Отчёт об успеваемости">Отчёт об успеваемости</option>
            </select>
          </div>
          <div class="form-group">
            <label>Название</label>
            <input type="text" id="doc-title" placeholder="Например: Итоговый отчёт за четверть">
          </div>
          <div class="form-group">
            <label>Содержание документа</label>
            <textarea id="doc-body" rows="4" placeholder="Введите текст шаблона или отчёта..."></textarea>
          </div>
          <button id="save-doc-btn" class="btn-primary">Сохранить документ</button>
        </div>

        <h3>Сохранённые шаблоны и отчёты</h3>
        <div id="docs-list" class="grid"></div>
      </section>
    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА РЕШЕНИЙ ПО ПРЕДМЕТУ -->
  <div id="subject-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-subject-title"></h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>
      <div id="modal-subject-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
